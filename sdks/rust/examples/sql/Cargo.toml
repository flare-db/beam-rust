[package]
name = "sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Beam Rust SDK SQL examples: join, filter and projection over Arrow tables"

[lib]
# Keep the library name distinct from the `apache-beam-sql` crate, whose lib is `sql`.
name = "sql_examples"
path = "src/lib.rs"

[dependencies]
beam = { workspace = true, features = ["prism", "parquet", "gcp-gcs"] }
sql = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow_io = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
